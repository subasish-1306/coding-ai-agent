services:
  postgres:
    image: postgres:16-alpine
    container_name: coding-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coding_ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-coding_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coding_ai} -d ${POSTGRES_DB:-coding_ai_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coding-ai-network

  redis:
    image: redis:7-alpine
    container_name: coding-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coding-ai-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: coding-ai-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coding_ai}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-coding_ai_agent}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "https://coding-ai-agent-s67b.onrender.com"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - coding-ai-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: coding-ai-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coding_ai}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-coding_ai_agent}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    networks:
      - coding-ai-network

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: coding-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - coding-ai-network

  nginx:
    image: nginx:alpine
    container_name: coding-ai-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - coding-ai-network

volumes:
  postgres_data:
  redis_data:

networks:
  coding-ai-network:
    driver: bridge
